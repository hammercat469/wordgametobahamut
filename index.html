<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>dragon name Game (JP)</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    color:white;

    font-family:sans-serif;

    text-align:center;

    padding:20px;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    transition:1s;

    overflow:hidden;

}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.55);

    z-index:-1;

}

h1{

    margin-bottom:10px;

    font-size:min(12vw,52px);

    text-shadow:0 0 20px black;

}

#score{

    margin-bottom:20px;

    font-size:min(6vw,24px);

    text-shadow:0 0 10px black;

}

.imageBox{

    margin-bottom:25px;

}

.imageBox img{

    width:min(80vw,320px);
    height:min(80vw,320px);

    object-fit:contain;

    background:rgba(0,0,0,0.5);

    border-radius:24px;

    box-shadow:0 10px 30px rgba(0,0,0,0.6);

}

#prefix{

    font-size:min(10vw,42px);

    font-weight:bold;

    color:#ffe27a;

    margin-bottom:20px;

    text-shadow:0 0 15px black;

}

.answer{

    display:flex;

    justify-content:center;

    gap:8px;

    margin-bottom:25px;

    flex-wrap:nowrap;

}

.slot{

    width:min(12vw,70px);
    height:min(12vw,70px);

    background:#3d456d;

    border-radius:18px;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:min(6vw,34px);

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;

    box-shadow:0 5px 15px rgba(0,0,0,0.5);

}

.slot.filled{

    background:#5b7cff;

    transform:scale(1.05);

}

.tiles{

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;

    max-width:800px;

    margin:auto;

}

.tile{

    width:min(12vw,70px);
    height:min(12vw,70px);

    border:none;

    border-radius:18px;

    background:white;

    color:#222;

    font-size:min(6vw,32px);

    font-weight:bold;

    cursor:pointer;

    transition:0.2s;

    box-shadow:0 5px 15px rgba(0,0,0,0.5);

}

.tile:hover{

    transform:translateY(-5px);

}

.tile.used{

    opacity:0;

    transform:scale(0);

    pointer-events:none;

}

#message{

    margin-top:30px;

    min-height:40px;

    font-size:min(8vw,34px);

    font-weight:bold;

    text-shadow:0 0 10px black;

}

.correct{

    color:#7dff9b;

}

.wrong{

    color:#ff8f8f;

}

#birthday{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.92);

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    z-index:999;

    padding:20px;

}

#birthday h1{

    font-size:min(14vw,90px);

    color:#ffe27a;

    animation:pop 1s infinite alternate;

}

#birthday h2{

    font-size:min(9vw,42px);

}

#birthday h4{

    font-size:min(5vw,24px);

    margin:10px 0;

}

#birthday p{

    font-size:min(8vw,42px);

}

@keyframes pop{

    from{

        transform:scale(1);

    }

    to{

        transform:scale(1.1);

    }

}

</style>
</head>

<body>

<h1>🐉dragon name Game (JP)</h1>

<div id="score"></div>

<div class="imageBox">

    <img id="image" src="">

</div>

<div id="prefix"></div>

<div class="answer" id="answer"></div>

<div class="tiles" id="tiles"></div>

<div id="message"></div>

<div id="birthday">

    <h1>🎉HAPPY BIRTHDAY</h1>

    <h2>Bahamutts!</h2>

    <h4>I always enjoy talking to you.</h4>

    <h4>I look forward to continuing our conversation. 😼🐲</h4>

    <p>全問正解だよ！！</p>

</div>

<script>

// 問題画像
const questions = [

{
    image:"ガンドロス.jpg",
    prefix:"砲龍",
    answer:"ガンドロス"
},

{
    image:"ダライアサン.png",
    prefix:"海龍",
    answer:"ダライアサン"
},

{
    image:"ディオラムス.png",
    prefix:"覇龍",
    answer:"ディオラムス"
},

{
    image:"バルス.jpg",
    prefix:"竜騎士",
    answer:"バルス"
},

{
    image:"ソドム.png",
    prefix:"地龍",
    answer:"ソドム"
}

];

// 背景画像
const backgrounds = [

"A.jpg",
"B2.png",
"C.png",
"D.jpg",
"E.png"

];

let currentQuestion = 0;

let score = 0;

let selectedQuestions = [];

function shuffle(array){

    return [...array].sort(
        ()=>Math.random()-0.5
    );

}

function getRandomQuestions(){

    selectedQuestions =
        shuffle(questions).slice(0,5);

}

function setRandomBackground(){

    const bg = backgrounds[
        Math.floor(
            Math.random() *
            backgrounds.length
        )
    ];

    document.body.style.backgroundImage =
        `url('${bg}')`;

}

function loadQuestion(){

    setRandomBackground();

    const q =
        selectedQuestions[currentQuestion];

    document.getElementById("image").src =
        q.image;

    document.getElementById("prefix").textContent =
        q.prefix;

    document.getElementById("score").textContent =
        `Score ${score}/${selectedQuestions.length} | Question ${currentQuestion+1}`;

    const answerDiv =
        document.getElementById("answer");

    const tilesDiv =
        document.getElementById("tiles");

    const message =
        document.getElementById("message");

    answerDiv.innerHTML = "";

    tilesDiv.innerHTML = "";

    message.textContent = "";

    message.className = "";

    const letters =
        q.answer.split("");

    let currentAnswer = [];

    // 最初から表示する文字
    const revealIndex =
        Math.floor(
            Math.random() * letters.length
        );

    letters.forEach((letter,index)=>{

        const slot =
            document.createElement("div");

        slot.className = "slot";

        if(index === revealIndex){

            slot.textContent = letter;

            slot.classList.add("filled");

            slot.dataset.locked = "true";

            currentAnswer[index] = letter;

        }else{

            currentAnswer[index] = "";

        }

        // 消せる
        slot.onclick = ()=>{

            if(slot.dataset.locked === "true")
                return;

            if(slot.textContent === "")
                return;

            const removed =
                slot.textContent;

            slot.textContent = "";

            slot.classList.remove("filled");

            currentAnswer[index] = "";

            document
            .querySelectorAll(".tile")
            .forEach(tile=>{

                if(
                    tile.textContent === removed &&
                    tile.classList.contains("used")
                ){

                    tile.classList.remove("used");

                }

            });

        };

        answerDiv.appendChild(slot);

    });

    // 選択肢
    let choices = [...letters];

    const katakana =
        "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポャュョッ";

    while(
        choices.length <
        letters.length + 4
    ){

        const randomLetter =
            katakana[
                Math.floor(
                    Math.random() *
                    katakana.length
                )
            ];

        if(!choices.includes(randomLetter)){

            choices.push(randomLetter);

        }

    }

    choices = shuffle(choices);

    choices.forEach(letter=>{

        const button =
            document.createElement("button");

        button.className = "tile";

        button.textContent = letter;

        button.onclick = ()=>{

            if(button.classList.contains("used"))
                return;

            const emptyIndex =
                currentAnswer.findIndex(
                    x => x === ""
                );

            if(emptyIndex === -1)
                return;

            currentAnswer[emptyIndex] = letter;

            const slot =
                answerDiv.children[emptyIndex];

            slot.textContent = letter;

            slot.classList.add("filled");

            button.classList.add("used");

            // 全部埋まった
            if(!currentAnswer.includes("")){

                const result =
                    currentAnswer.join("");

                // 正解
                if(result === q.answer){

                    message.textContent =
                        "✅ Correct!";

                    message.className =
                        "correct";

                    score++;

                }else{

                    message.textContent =
                        "❌ Wrong!";

                    message.className =
                        "wrong";

                }

                // 次へ
                setTimeout(()=>{

                    currentQuestion++;

                    // 全問終了
                    if(
                        currentQuestion >=
                        selectedQuestions.length
                    ){

                        // 全問正解
                        if(
                            score ===
                            selectedQuestions.length
                        ){

                            document
                            .getElementById(
                                "birthday"
                            )
                            .style.display =
                            "flex";

                            return;

                        }else{

                            alert(
                                `ゲーム終了！\nScore ${score}/${selectedQuestions.length}Try again!!`
                            );

                        }

                        currentQuestion = 0;

                        score = 0;

                        getRandomQuestions();

                    }

                    loadQuestion();

                },1000);

            }

        };

        tilesDiv.appendChild(button);

    });

}

getRandomQuestions();

loadQuestion();

</script>

</body>
</html>
