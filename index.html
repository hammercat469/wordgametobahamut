<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bahamut Birthday Game</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    color:white;

    font-family:sans-serif;

    text-align:center;

    min-height:100vh;

    padding:20px;

    transition:1s;
}

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.55);

    z-index:-1;

}

h1{
    margin-bottom:10px;
}

#score{
    margin-bottom:20px;
    font-size:20px;
}

.imageBox{
    margin-bottom:25px;
}

.imageBox img{

    width:300px;
    height:300px;

    object-fit:contain;

    background:#111;

    border-radius:24px;

    box-shadow:0 10px 30px rgba(0,0,0,0.5);

}

#prefix{

    font-size:34px;
    font-weight:bold;

    color:#ffe27a;

    margin-bottom:20px;

}

.answer{

    display:flex;
    justify-content:center;

    gap:10px;

    margin-bottom:25px;

    flex-wrap:wrap;
}

.slot{

    width:65px;
    height:65px;

    background:#3d456d;

    border-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:30px;
    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

.slot.filled{

    background:#5b7cff;

    transform:scale(1.05);

}

.tiles{

    display:flex;
    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

}

.tile{

    width:65px;
    height:65px;

    border:none;

    border-radius:16px;

    background:white;

    color:#222;

    font-size:28px;
    font-weight:bold;

    cursor:pointer;

    transition:0.2s;

}

.tile:hover{

    transform:translateY(-5px);

}

.tile.used{

    opacity:0.2;

    transform:scale(0);

    pointer-events:none;

}

#message{

    margin-top:25px;

    min-height:40px;

    font-size:30px;
    font-weight:bold;

}

.correct{

    color:#7dff9b;

}

.wrong{

    color:#ff8f8f;

}

#birthday{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,0.9);

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    z-index:100;

    animation:fadeIn 1s;

}

#birthday h1{

    font-size:70px;

    color:#ffe27a;

    animation:pop 1s infinite alternate;

}

#birthday p{

    font-size:32px;

}

@keyframes fadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes pop{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.1);
    }

}

</style>
</head>

<body>

<h1>🐉 Bahamut Birthday Game</h1>

<div id="score"></div>

<div class="imageBox">
    <img id="image" src="">
</div>

<div id="prefix"></div>

<div class="answer" id="answer"></div>

<div class="tiles" id="tiles"></div>

<div id="message"></div>

<div id="birthday">

    <h1>🎉 HAPPY BIRTHDAY 🎉</h1>

    <p>全問正解！！</p>

</div>

<script>

const questions = [

{
    image:"A.jpg",
    prefix:"砲龍",
    answer:"ガンドロス"
},

{
    image:"B2.png",
    prefix:"海龍",
    answer:"ダライアサン"
},

{
    image:"C.png",
    prefix:"覇龍",
    answer:"ディオラムス"
},

{
    image:"D.jpg",
    prefix:"竜騎士",
    answer:"バルス"
},

{
    image:"E.png",
    prefix:"地龍",
    answer:"ソドム"
}

];

// 背景画像
const backgrounds = [

"A.jpg",
"B2.png",
"C.png",
"D.jpg",
"E.png"

];

let currentQuestion = 0;
let score = 0;

let selectedQuestions = [];

function shuffle(array){

    return [...array].sort(
        ()=>Math.random()-0.5
    );

}

function getRandomQuestions(){

    selectedQuestions =
        shuffle(questions).slice(0,5);

}

function setRandomBackground(){

    const bg = backgrounds[
        Math.floor(
            Math.random() *
            backgrounds.length
        )
    ];

    document.body.style.backgroundImage =
        `url('${bg}')`;

}

function loadQuestion(){

    setRandomBackground();

    const q =
        selectedQuestions[currentQuestion];

    document.getElementById("image").src =
        q.image;

    document.getElementById("prefix").textContent =
        q.prefix;

    document.getElementById("score").textContent =
        `Score ${score}/${selectedQuestions.length} | Question ${currentQuestion+1}`;

    const answerDiv =
        document.getElementById("answer");

    const tilesDiv =
        document.getElementById("tiles");

    const message =
        document.getElementById("message");

    answerDiv.innerHTML = "";
    tilesDiv.innerHTML = "";

    message.textContent = "";
    message.className = "";

    const letters =
        q.answer.split("");

    let currentAnswer = [];

    // 1文字表示
    const revealIndex =
        Math.floor(
            Math.random() * letters.length
        );

    letters.forEach((letter,index)=>{

        const slot =
            document.createElement("div");

        slot.className = "slot";

        if(index === revealIndex){

            slot.textContent = letter;

            slot.classList.add("filled");

            slot.dataset.locked = "true";

            currentAnswer[index] = letter;

        }else{

            currentAnswer[index] = "";

        }

        slot.onclick = ()=>{

            if(slot.dataset.locked === "true")
                return;

            if(slot.textContent === "")
                return;

            const removed =
                slot.textContent;

            slot.textContent = "";

            slot.classList.remove("filled");

            currentAnswer[index] = "";

            document
            .querySelectorAll(".tile")
            .forEach(tile=>{

                if(
                    tile.textContent === removed &&
                    tile.classList.contains("used")
                ){

                    tile.classList.remove("used");

                }

            });

        };

        answerDiv.appendChild(slot);

    });

    // カタカナ選択肢
    let choices = [...letters];

    const katakana =
        "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポャュョッ";

    while(
        choices.length <
        letters.length + 4
    ){

        const randomLetter =
            katakana[
                Math.floor(
                    Math.random() *
                    katakana.length
                )
            ];

        if(!choices.includes(randomLetter)){

            choices.push(randomLetter);

        }

    }

    choices = shuffle(choices);

    choices.forEach(letter=>{

        const button =
            document.createElement("button");

        button.className = "tile";

        button.textContent = letter;

        button.onclick = ()=>{

            if(button.classList.contains("used"))
                return;

            const emptyIndex =
                currentAnswer.findIndex(
                    x => x === ""
                );

            if(emptyIndex === -1)
                return;

            currentAnswer[emptyIndex] = letter;

            const slot =
                answerDiv.children[emptyIndex];

            slot.textContent = letter;

            slot.classList.add("filled");

            button.classList.add("used");

            if(!currentAnswer.includes("")){

                const result =
                    currentAnswer.join("");

                if(result === q.answer){

                    message.textContent =
                        "✅ Correct!";

                    message.className =
                        "correct";

                    score++;

                }else{

                    message.textContent =
                        "❌ Wrong!";

                    message.className =
                        "wrong";

                }

                setTimeout(()=>{

                    currentQuestion++;

                    // 全問終了
                    if(
                        currentQuestion >=
                        selectedQuestions.length
                    ){

                        // 全問正解
                        if(
                            score ===
                            selectedQuestions.length
                        ){

                            document
                            .getElementById(
                                "birthday"
                            )
                            .style.display =
                            "flex";

                            return;

                        }else{

                            alert(
                                `ゲーム終了！\nScore ${score}/${selectedQuestions.length}`
                            );

                        }

                        currentQuestion = 0;

                        score = 0;

                        getRandomQuestions();

                    }

                    loadQuestion();

                },1000);

            }

        };

        tilesDiv.appendChild(button);

    });

}

getRandomQuestions();

loadQuestion();

</script>

</body>
</html>
