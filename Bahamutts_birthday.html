<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dragon Emperor's word game</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:linear-gradient(135deg,#1e2238,#2f3760);
    color:white;
    font-family:sans-serif;
    text-align:center;
    min-height:100vh;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

#score{
    margin-bottom:20px;
    font-size:20px;
}

.imageBox{
    margin-bottom:25px;
}

.imageBox img{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    background:#111;
}

.answer{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
    flex-wrap:wrap;
}

.slot{
    width:65px;
    height:65px;

    background:#3d456d;

    border-radius:16px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:32px;
    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

.slot.filled{
    background:#5b7cff;
    transform:scale(1.05);
}

.tiles{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.tile{
    width:65px;
    height:65px;

    border:none;
    border-radius:16px;

    background:white;
    color:#222;

    font-size:32px;
    font-weight:bold;

    cursor:pointer;

    transition:0.2s;
}

.tile:hover{
    transform:translateY(-5px);
}

.tile.used{
    opacity:0.2;
    transform:scale(0);
    pointer-events:none;
}

#message{
    margin-top:25px;
    min-height:40px;
    font-size:28px;
    font-weight:bold;
}

.correct{
    color:#7dff9b;
}

.wrong{
    color:#ff8f8f;
}

</style>
</head>

<body>

<h1>🐾 Word Tile Game</h1>

<div id="score"></div>

<div class="imageBox">
    <img id="image" src="">
</div>

<div class="answer" id="answer"></div>

<div class="tiles" id="tiles"></div>

<div id="message"></div>

<script>

const questions = [

{
    image:"https://placehold.co/300x300/png?text=CAT",
    answer:"cat"
},

{
    image:"https://placehold.co/300x300/png?text=DOG",
    answer:"dog"
},

{
    image:"https://placehold.co/300x300/png?text=FISH",
    answer:"fish"
},

{
    image:"https://placehold.co/300x300/png?text=APPLE",
    answer:"apple"
},

{
    image:"https://placehold.co/300x300/png?text=BIRD",
    answer:"bird"
}

];

let currentQuestion = 0;
let score = 0;

function shuffle(array){

    return [...array].sort(
        ()=>Math.random()-0.5
    );

}

function loadQuestion(){

    const q = questions[currentQuestion];

    document.getElementById("image").src =
        q.image;

    document.getElementById("score").textContent =
        `Score ${score}/${questions.length} | Question ${currentQuestion+1}`;

    const answerDiv =
        document.getElementById("answer");

    const tilesDiv =
        document.getElementById("tiles");

    const message =
        document.getElementById("message");

    answerDiv.innerHTML = "";
    tilesDiv.innerHTML = "";

    message.textContent = "";
    message.className = "";

    const letters =
        q.answer.split("");

    let currentAnswer = [];

    // 1文字表示
    const revealIndex =
        Math.floor(
            Math.random() * letters.length
        );

    letters.forEach((letter,index)=>{

        const slot =
            document.createElement("div");

        slot.className = "slot";

        if(index === revealIndex){

            slot.textContent = letter;

            slot.classList.add("filled");

            slot.dataset.locked = "true";

            currentAnswer[index] = letter;

        }else{

            currentAnswer[index] = "";

        }

        // 消せる
        slot.onclick = ()=>{

            if(slot.dataset.locked === "true")
                return;

            if(slot.textContent === "")
                return;

            const removed =
                slot.textContent;

            slot.textContent = "";

            slot.classList.remove("filled");

            currentAnswer[index] = "";

            document
            .querySelectorAll(".tile")
            .forEach(tile=>{

                if(
                    tile.textContent === removed &&
                    tile.classList.contains("used")
                ){

                    tile.classList.remove("used");

                }

            });

        };

        answerDiv.appendChild(slot);

    });

    // 選択肢生成
    let choices = [...letters];

    const alphabet =
        "abcdefghijklmnopqrstuvwxyz";

    while(
        choices.length <
        letters.length + 3
    ){

        const randomLetter =
            alphabet[
                Math.floor(
                    Math.random() *
                    alphabet.length
                )
            ];

        if(!choices.includes(randomLetter)){

            choices.push(randomLetter);

        }

    }

    choices = shuffle(choices);

    choices.forEach(letter=>{

        const button =
            document.createElement("button");

        button.className = "tile";

        button.textContent = letter;

        button.onclick = ()=>{

            if(button.classList.contains("used"))
                return;

            const emptyIndex =
                currentAnswer.findIndex(
                    x => x === ""
                );

            if(emptyIndex === -1)
                return;

            currentAnswer[emptyIndex] = letter;

            const slot =
                answerDiv.children[emptyIndex];

            slot.textContent = letter;

            slot.classList.add("filled");

            button.classList.add("used");

            // 全部埋まった
            if(!currentAnswer.includes("")){

                const result =
                    currentAnswer.join("");

                // 正解
                if(result === q.answer){

                    message.textContent =
                        "✅ Correct!";

                    message.className =
                        "correct";

                    score++;

                }else{

                    message.textContent =
                        "❌ Wrong!";

                    message.className =
                        "wrong";
                }

                // 次の問題へ
                setTimeout(()=>{

                    currentQuestion++;

                    // 全問終了
                    if(
                        currentQuestion >=
                        questions.length
                    ){

                        if(
                            score ===
                            questions.length
                        ){

                            alert(
                                "🎉 PERFECT!! 全問正解！！"
                            );

                        }else{

                            alert(
                                `ゲーム終了！\nScore ${score}/${questions.length}`
                            );

                        }

                        currentQuestion = 0;
                        score = 0;

                    }

                    loadQuestion();

                },1000);

            }

        };

        tilesDiv.appendChild(button);

    });

}

loadQuestion();

</script>

</body>
</html>
